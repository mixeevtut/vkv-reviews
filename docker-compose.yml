services:
  postgres:
    image: postgres:17.4-alpine3.21
    container_name: vkvideo_reviews_serv_postgres
    environment:
      POSTGRES_DB: vkvideo_reviews_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vkvideo_reviews_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
