services:
  postgres:
    image: postgres:17.4-alpine3.21
    container_name: vkvideo_reviews_serv_postgres
    environment:
      POSTGRES_DB: vkvideo_reviews_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vkvideo_reviews_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  redis:
    image: redis:8.2.3-alpine3.22
    container_name: app-redis
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${APP_REDIS_PASS:-redis}"]
    ports:
      - "6379:6379"
    volumes:
      - ./redis/data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -qx PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDISCLI_AUTH: ${APP_REDIS_PASS:-redis}
    restart: unless-stopped
